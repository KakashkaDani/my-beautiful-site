<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mega Site 2.0 - Ultimate Experience</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #ec4899;
            --dark: #0f172a;
            --light: #f8fafc;
            --glass: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: var(--light);
            min-height: 100vh;
            overflow-x: hidden;
        }
        .bg-animation {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden;
        }
        .blob {
            position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.4;
            animation: float 10s infinite ease-in-out;
        }
        .blob:nth-child(1) { top: 10%; left: 10%; width: 300px; height: 300px; background: var(--primary); animation-delay: 0s; }
        .blob:nth-child(2) { bottom: 20%; right: 10%; width: 400px; height: 400px; background: var(--secondary); animation-delay: 2s; }
        .blob:nth-child(3) { top: 40%; left: 60%; width: 250px; height: 250px; background: #8b5cf6; animation-delay: 4s; }
        @keyframes float { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(30px, -30px); } }
        nav {
            position: fixed; top: 0; left: 0; right: 0;
            background: var(--glass); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border); z-index: 1000;
            padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-size: 1.5rem; font-weight: bold; background: linear-gradient(to right, var(--primary), var(--secondary)); -webkit-background-clip: text; color: transparent; }
        .nav-links {
            display: flex; gap: 0.5rem; overflow-x: auto; scrollbar-width: none; max-width: 70%;
        }
        .nav-links::-webkit-scrollbar { display: none; }
        .nav-btn {
            background: transparent; border: 1px solid var(--border); color: var(--light);
            padding: 0.5rem 1rem; border-radius: 20px; cursor: pointer; white-space: nowrap;
            transition: all 0.3s; font-size: 0.9rem;
        }
        .nav-btn:hover, .nav-btn.active {
            background: var(--primary); border-color: var(--primary);
            transform: translateY(-2px); box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }
        main { margin-top: 80px; padding: 2rem; max-width: 1400px; margin-left: auto; margin-right: auto; }
        .page-section { display: none; animation: fadeIn 0.5s ease; }
        .page-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        h1 { font-size: 3rem; margin-bottom: 1rem; text-align: center; }
        h2 { font-size: 2rem; margin-bottom: 2rem; color: var(--secondary); }
        .widgets-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; margin-bottom: 3rem;
        }
        .widget {
            background: var(--glass); border: 1px solid var(--border); border-radius: 15px;
            padding: 1.5rem; backdrop-filter: blur(10px); transition: transform 0.3s;
        }
        .widget:hover { transform: translateY(-5px); border-color: var(--primary); }
        .widget h3 { font-size: 0.9rem; opacity: 0.7; margin-bottom: 0.5rem; }
        .widget .value { font-size: 1.8rem; font-weight: bold; }
        .gallery {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem;
        }
        .gallery-item {
            border-radius: 10px; overflow: hidden; aspect-ratio: 1; cursor: pointer; position: relative;
        }
        .gallery-item img {
            width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s;
        }
        .gallery-item:hover img { transform: scale(1.1); }
        .contact-form {
            max-width: 600px; margin: 0 auto; background: var(--glass); padding: 2rem; border-radius: 15px;
        }
        .form-group { margin-bottom: 1rem; }
        input, textarea {
            width: 100%; padding: 1rem; background: rgba(0,0,0,0.3);
            border: 1px solid var(--border); border-radius: 8px; color: white;
        }
        button.submit {
            width: 100%; padding: 1rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            border: none; border-radius: 8px; color: white; font-weight: bold;
            cursor: pointer; transition: opacity 0.3s;
        }
        button.submit:hover { opacity: 0.9; }
        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .nav-links { max-width: 100%; }
            nav { flex-direction: column; gap: 1rem; }
        }
    </style>
</head>
<body>
    <div class="bg-animation">
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
    </div>
    <nav>
        <div class="logo"><i class="fas fa-rocket"></i> MEGA SITE</div>
        <div class="nav-links" id="navContainer"></div>
    </nav>
    <main id="content"></main>
    <script>
        const tabs = [
            { id: 'home', icon: 'fa-home', label: 'Главная' },
            { id: 'news', icon: 'fa-newspaper', label: 'Новости' },
            { id: 'crypto', icon: 'fa-bitcoin', label: 'Крипто' },
            { id: 'weather', icon: 'fa-cloud-sun', label: 'Погода' },
            { id: 'portfolio', icon: 'fa-images', label: 'Портфолио' },
            { id: 'services', icon: 'fa-concierge-bell', label: 'Услуги' },
            { id: 'team', icon: 'fa-users', label: 'Команда' },
            { id: 'blog', icon: 'fa-pen-fancy', label: 'Блог' },
            { id: 'stats', icon: 'fa-chart-line', label: 'Статистика' },
            { id: 'gallery', icon: 'fa-camera', label: 'Галерея' },
            { id: 'pricing', icon: 'fa-tags', label: 'Цены' },
            { id: 'faq', icon: 'fa-question', label: 'FAQ' },
            { id: 'testimonials', icon: 'fa-comment-dots', label: 'Отзывы' },
            { id: 'careers', icon: 'fa-briefcase', label: 'Карьера' },
            { id: 'events', icon: 'fa-calendar-alt', label: 'События' },
            { id: 'shop', icon: 'fa-shopping-cart', label: 'Магазин' },
            { id: 'docs', icon: 'fa-book', label: 'Документы' },
            { id: 'api', icon: 'fa-code', label: 'API' },
            { id: 'support', icon: 'fa-headset', label: 'Поддержка' },
            { id: 'contact', icon: 'fa-envelope', label: 'Контакты' }
        ];
        let activeTab = 'home';
        function init() { renderNav(); switchTab('home'); startLiveWidgets(); }
        function renderNav() {
            const container = document.getElementById('navContainer');
            container.innerHTML = tabs.map(tab => 
                '<button class="nav-btn ' + (tab.id === activeTab ? 'active' : '') + '" onclick="switchTab(\'' + tab.id + '\')">' +
                '<i class="fas ' + tab.icon + '"></i> ' + tab.label + '</button>'
            ).join('');
        }
        window.switchTab = function(id) {
            activeTab = id;
            renderNav();
            renderContent(id);
        };
        function renderContent(id) {
            const main = document.getElementById('content');
            const tab = tabs.find(t => t.id === id);
            let content = '';
            if (id === 'home') {
                content = '<h1>Добро пожаловать в будущее</h1>' +
                    '<p style="text-align:center; opacity:0.8; margin-bottom:2rem;">Самый быстрый и красивый сайт в интернете</p>' +
                    '<div class="widgets-grid">' +
                    '<div class="widget"><h3><i class="fas fa-clock"></i> Время</h3><div class="value" id="clock">--:--</div></div>' +
                    '<div class="widget"><h3><i class="fas fa-eye"></i> Посетители</h3><div class="value" id="visitors">1,337</div></div>' +
                    '<div class="widget"><h3><i class="fas fa-server"></i> Статус</h3><div class="value" style="color:#4ade80">Online</div></div>' +
                    '<div class="widget"><h3><i class="fas fa-bolt"></i> Нагрузка</h3><div class="value" id="load">0%</div></div>' +
                    '</div>' +
                    '<div style="background:var(--glass); padding:2rem; border-radius:15px; text-align:center;">' +
                    '<h2>Почему мы?</h2>' +
                    '<p>Мы используем передовые технологии SPA (Single Page Application), чтобы обеспечить мгновенную загрузку без перезагрузки страниц.</p>' +
                    '</div>';
            } else if (id === 'portfolio' || id === 'gallery') {
                content = '<h1>' + tab.label + '</h1><div class="gallery">';
                for(let i=1; i<=12; i++) {
                    content += '<div class="gallery-item"><img src="https://picsum.photos/400?random=' + (i*10) + '" alt="Photo"></div>';
                }
                content += '</div>';
            } else if (id === 'crypto') {
                content = '<h1>Крипто Рынок</h1>' +
                    '<div class="widgets-grid">' +
                    '<div class="widget"><h3>Bitcoin</h3><div class="value" id="btc-price">Загрузка...</div></div>' +
                    '<div class="widget"><h3>Ethereum</h3><div class="value" id="eth-price">Загрузка...</div></div>' +
                    '<div class="widget"><h3>Solana</h3><div class="value" id="sol-price">Загрузка...</div></div>' +
                    '</div>';
                setTimeout(fetchCrypto, 1000);
            } else if (id === 'contact') {
                content = '<h1>Свяжитесь с нами</h1>' +
                    '<form class="contact-form" onsubmit="event.preventDefault(); alert(\'Сообщение отправлено!\');">' +
                    '<div class="form-group"><input type="text" placeholder="Ваше имя" required></div>' +
                    '<div class="form-group"><input type="email" placeholder="Email" required></div>' +
                    '<div class="form-group"><textarea rows="5" placeholder="Сообщение"></textarea></div>' +
                    '<button type="submit" class="submit">Отправить</button>' +
                    '</form>';
            } else {
                content = '<h1>' + tab.label + '</h1>' +
                    '<div style="background:var(--glass); padding:2rem; border-radius:15px;">' +
                    '<p>Здесь располагается контент раздела <strong>' + tab.label + '</strong>.</p><br>' +
                    '<div class="widgets-grid">' +
                    '<div class="widget"><h3>Информация</h3><div class="value">Актуально</div></div>' +
                    '<div class="widget"><h3>Статус</h3><div class="value">OK</div></div>' +
                    '</div>' +
                    '<p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>' +
                    '<div style="margin-top:1rem; height:200px; background:rgba(0,0,0,0.2); border-radius:10px; display:flex; align-items:center; justify-content:center;">' +
                    '<i class="fas ' + tab.icon + '" style="font-size:3rem; opacity:0.5;"></i>' +
                    '</div></div>';
            }
            main.innerHTML = '<div class="page-section active">' + content + '</div>';
        }
        function startLiveWidgets() {
            setInterval(function() {
                const now = new Date();
                document.getElementById('clock').innerText = now.toLocaleTimeString();
                document.getElementById('load').innerText = Math.floor(Math.random() * 30 + 10) + '%';
                const vis = parseInt(document.getElementById('visitors').innerText.replace(',', ''));
                if(Math.random() > 0.7) {
                    document.getElementById('visitors').innerText = (vis + 1).toLocaleString();
                }
            }, 1000);
        }
        async function fetchCrypto() {
            try {
                const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana&vs_currencies=usd');
                const data = await res.json();
                if(data.bitcoin) document.getElementById('btc-price').innerText = '$' + data.bitcoin.usd.toLocaleString();
                if(data.ethereum) document.getElementById('eth-price').innerText = '$' + data.ethereum.usd.toLocaleString();
                if(data.solana) document.getElementById('sol-price').innerText = '$' + data.solana.usd.toLocaleString();
            } catch(e) {
                document.getElementById('btc-price').innerText = '$64,231';
                document.getElementById('eth-price').innerText = '$3,452';
                document.getElementById('sol-price').innerText = '$148';
            }
        }
        init();
    </script>
</body>
</html>
